[package]
name = "deepseek-harness-desktop"
version = "0.1.0"
description = "DeepSeek Harness desktop shell"
authors = ["DeepSeek AI"]
edition = "2021"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "process", "io-util"] }
