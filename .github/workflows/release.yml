name: Release desktop packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布标签，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release packages
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ github.sha }}
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deepseek-harness-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print
          test -n "$(find release-assets -type f -print -quit)"

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "DeepSeek Harness Desktop $RELEASE_TAG" \
              --notes "内置 Node 24 的 DeepSeek Harness Desktop 安装包。"
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
