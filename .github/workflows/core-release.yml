name: Build and Release Harness Core

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '要打包的 dsh 版本，例如 0.1.2-alpha.4'
        required: true
        default: '0.1.2-alpha.4'
        type: string
  workflow_call:
    inputs:
      dsh_version:
        description: '要打包的 dsh 版本'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: harness-core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            artifact_name: deepseek-harness-pkg-windows.zip
          - os: macos-latest
            target: macos-arm64
            artifact_name: deepseek-harness-pkg-macos-arm64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Check toolchain
        run: |
          node --version
          pnpm --version
          node -p 'process.platform + "/" + process.arch'

      - name: Build standalone core package
        shell: bash
        env:
          DSH_VERSION: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
        run: |
          set -euo pipefail
          test -n "$DSH_VERSION"
          cd runtime
          pnpm add "@deepseek-ai/dsh@${DSH_VERSION}" --save-exact
          pnpm install
          pnpm deploy --filter deepseek-harness-runtime --fail-if-no-match --prod build_dir --legacy
          cd build_dir
          node ../../scripts/prepare-harness-core-package.mjs --version="$DSH_VERSION"
          find node_modules -type f \( -name '*.map' -o -name '*.ts' -o -name '*.mts' \) -delete
          find node_modules -type d \( -name test -o -name tests -o -name benchmark -o -name benchmarks -o -name example -o -name examples -o -name demo -o -name demos \) -prune -exec rm -rf {} +
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../../${{ matrix.artifact_name }}" node_modules package.json package-lock.json
          else
            zip -r "../../${{ matrix.artifact_name }}" node_modules package.json package-lock.json
          fi

      - name: Upload core package
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-core-${{ matrix.target }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish core release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download core packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: deepseek-harness-core-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dsh-${{ inputs.dsh_version || github.event.inputs.dsh_version }}-${{ github.run_id }}
          name: DeepSeek Harness Core ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
          body: |
            Standalone DeepSeek Harness core package.

            - dsh version: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
            - build run: ${{ github.run_id }}
            - generated by ${{ github.repository }}
          draft: false
          prerelease: false
          files: artifacts/*.zip
